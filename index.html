<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multas J.A.C</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="body">
    <div class="container">
        <header class="header">

            <div class="img">
                <img src="img/logo ssp.png" alt="Logo de la J.A.C">
            </div>

            <div class="titulo">
                <h1>Consulta de multas</h1>
                <p>Conoce tu estado y multas pendientes</p>
            </div>

            <div class="usuario">
                <button class="btn btn-usuario">J.A.C</button>
            </div>

        </header>
        <main class="main">
            <section class="consulta-multas">

                <h1>Consulta tus multas</h1>

                <form class="formulario-consulta" id="formulario">
                    <label for="casa"><p>Ingrese numero de la casa</p></label>
                    <input type="text" id="casa" name="casa" class="input-consulta"  placeholder="Ejem: 30, 15, 27" autocomplete="off">
                    <button class="btn btn-consultar" type="submit">Consultar</button>
                </form>

            </section>

            <section class="oculto resultado" id="resultado">

            </section>
        </main>
        <footer class="footer">
            <p>J.A.C - Junta de Accion Comunal</p>
            <p>&copy; 2026 Todos los dereechos reservados</p>
        </footer>
    </div>
</body>
</html>
