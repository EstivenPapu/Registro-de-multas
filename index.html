<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multas J.A.C</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="body">
    <div class="container">
    <header class="header">

        <div class="img">
            <img src="img/logo ssp.png" alt="Logo de la J.A.C">
        </div>

        <div class="titulo">
            <h1>Consulta de multas</h1>
            <p>Conoce tu estado y multas pendientes</p>
        </div>

        <div class="usuario">
            <button class="btn-usuario">J.A.C</button>
        </div>
        
    </header>
    <main>
        <section class="consulta-multas">

            <h2>Consulta tus multas</h2>

            <form class="formulario-consulta" id="formulario">
                <input type="text" id="casa" name="casa" class="input-consulta"  placeholder="Ingrese su número de casa" autocomplete="off">
                <button class="btn-consultar" type="submit">Consultar</button>
            </form>
            
        </section>

        <section class="oculto resultado" id="resultado">

            


        </section>
    </main>
    </div>
</body>
</html>
